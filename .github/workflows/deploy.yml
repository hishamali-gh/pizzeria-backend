name: Pizzeria Backend CI/CD Pipeline

# TRIGGER
on:
  push:
    branches:
      - main

jobs:
  # INTEGRATION PART
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Run Django Configuration Check
        env:
          SECRET_KEY: "temporary-secret-key-only-used-for-ci-tests"
        run: |
          python manage.py check

  # DEPLOYMENT PART
  deploy:
    needs: test # This ensures the deploy job runs only after the test job succeeds.
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3 # A popular community action that opens an SSH connection from the GitHub runner to your EC2 instance.
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/pizzeria/backend
            git pull origin main
            cd ~/pizzeria
            docker-compose up -d --build backend
